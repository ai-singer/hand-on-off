[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-agent-template"
version = "0.1.0"
description = "OpenClaw Creator Agent framework template instance"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = [
  "config",
  "config.runtime",
  "core",
  "distillation_core",
  "evaluation",
  "plugin_interface",
  "plugins",
  "plugins.xiaolin_finance",
  "skills",
  "skills.openclaw",
  "workflows",
  "workflows.content_distillation_pipeline",
  "workflows.lobster",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
