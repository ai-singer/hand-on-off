# XHS Source Schema
# version: 2.0.0
# updated: 2026-09-22

$schema:
  id: xhs_normalized_post
  version: "2.0.0"
  platform: xiaohongshu

# Storage Path Convention
#
# source_material/xhs/{category}/{type}/{note_id}.json
#
# category: finance | travel | tech | lifestyle | general | ...
# type:     video | image_text

fields:

  platform:
    type: string
    const: "xiaohongshu"
    required: true

  category:
    type: string
    required: true
    notes: "垂类标签，如 finance / travel / tech / lifestyle / general"

  content_type:
    type: string
    enum: ["video", "image_text"]
    required: true
    notes: "内容格式；video=视频笔记，image_text=图文笔记"

  discovery_role:
    type: string
    enum: ["topic_discovery", "knowledge_distillation", "pending"]
    required: true
    notes: |
      依据 source_strategy.md 规则分配：
      - video → topic_discovery（用于发现用户问题，不提取观点）
      - image_text → knowledge_distillation（用于学习表达结构）
      - pending → 尚未分配

  creator:
    type: object
    required: true
    fields:
      id:
        type: string
        source: note_card.user.user_id
        required: true
      name:
        type: string
        source: note_card.user.nickname
        required: true
      avatar:
        type: string
        source: note_card.user.avatar
        required: false

  post_id:
    type: string
    source: note_card.note_id
    required: true

  title:
    type: string
    source: note_card.title
    required: false
    notes: "部分笔记无独立标题，此时与 text 首行相同"

  text:
    type: string
    source: note_card.desc
    required: false
    notes: "完整正文，含换行符"

  images:
    type: array
    items:
      type: object
      fields:
        url:
          type: string
          source: "image_list[i].url_default ?? image_list[i].url_pre"
          required: true
        width:
          type: integer
          source: image_list[i].width
          required: false
        height:
          type: integer
          source: image_list[i].height
          required: false
        file_id:
          type: string
          source: image_list[i].file_id
          required: false
    required: false

  tags:
    type: array
    items:
      type: string
    source: "note_card.tag_list[].name"
    required: false

  metrics:
    type: object
    required: true
    notes: "流量数据与内容绑定存储，原始字符串格式保留"
    fields:
      liked_count:
        type: string
        source: note_card.interact_info.liked_count
      collected_count:
        type: string
        source: note_card.interact_info.collected_count
      comment_count:
        type: string
        source: note_card.interact_info.comment_count
      share_count:
        type: string
        source: note_card.interact_info.share_count

  content_signal_score:
    type: number
    required: false
    notes: |
      依据 source_strategy.md 素材价值评分计算：
      collected × 0.35 + share × 0.30 + comment_quality × 0.25 + liked × 0.10
      由 normalize.py 写入，范围 0–100

  material_tier:
    type: string
    enum: ["S", "A", "B", "C", "unrated"]
    required: false
    notes: |
      素材优先级分级（依据 content_signal_score）：
      S: 优先生产池 | A: 研究池 | B: 趋势观察 | C: 丢弃

  topic_candidate:
    type: object
    required: false
    notes: "仅 discovery_role=topic_discovery 时填写"
    fields:
      topic:
        type: string
      user_question:
        type: string
      audience_pain_point:
        type: string
      cognitive_conflict:
        type: string
      content_pattern_notes:
        type: string

  source_url:
    type: string
    required: true
    template: "https://www.xiaohongshu.com/explore/{post_id}"
    notes: "由 post_id 构造，不从 API 直接获取"

  collected_at:
    type: string
    format: ISO8601
    required: true
    notes: "采集时间，由 Collector 在写入时注入"

  raw_ref:
    type: string
    required: false
    notes: "指向 raw/ 目录下对应原始文件的相对路径，用于溯源"
