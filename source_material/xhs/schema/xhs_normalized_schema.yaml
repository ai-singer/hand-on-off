# XHS Source Schema
# version: 2.1.0
# updated: 2026-09-22

$schema:
  id: xhs_normalized_post
  version: "2.1.0"
  platform: xiaohongshu

# Storage Path Convention
#
# image_text:
#   source_material/xhs/{category}/image_text/{note_id}.json
#
# video:
#   source_material/xhs/{category}/video/{note_id}/
#     ├── meta.json            笔记元数据 + 流量数据
#     ├── transcript.json      完整字幕（含时间戳）
#     └── frames/
#         └── {timestamp}/
#             ├── frame.jpg    静态图片帧
#             └── transcript.json  该时间段对应字幕
#
# category: finance | travel | tech | lifestyle | general | ...

# ── Video Processing Rules ───────────────────────────────────────
#
# ASR:
#   Engine: OpenAI Whisper (model=base)
#   Priority: embedded subtitle (.srt/.vtt) > ASR
#   Language: zh (Chinese default)
#
# Static Frame Detection:
#   Threshold: 1 second of visually identical frames
#   Method: frame diff (SSIM or pixel diff)
#   Capture: middle frame of static segment
#   Output: JPEG, max 1280px wide

fields:

  # ── Common Fields (image_text + video) ──────────────────────────

  platform:
    type: string
    const: "xiaohongshu"
    required: true

  category:
    type: string
    required: true
    notes: "垂类标签，如 finance / travel / tech / lifestyle / general"

  content_type:
    type: string
    enum: ["video", "image_text"]
    required: true
    notes: "内容格式；video=视频笔记，image_text=图文笔记"

  discovery_role:
    type: string
    enum: ["topic_discovery", "knowledge_distillation", "pending"]
    required: true
    notes: |
      依据 source_strategy.md 规则分配：
      - video → topic_discovery（用于发现用户问题，不提取观点）
      - image_text → knowledge_distillation（用于学习表达结构）
      - pending → 尚未分配

  creator:
    type: object
    required: true
    fields:
      id:
        type: string
        source: note_card.user.user_id
        required: true
      name:
        type: string
        source: note_card.user.nickname
        required: true
      avatar:
        type: string
        source: note_card.user.avatar
        required: false

  post_id:
    type: string
    source: note_card.note_id
    required: true

  title:
    type: string
    source: note_card.title
    required: false

  text:
    type: string
    source: note_card.desc
    required: false
    notes: "完整正文，含换行符"

  tags:
    type: array
    items:
      type: string
    source: "note_card.tag_list[].name"
    required: false

  metrics:
    type: object
    required: true
    notes: "流量数据与内容绑定存储，原始字符串格式保留"
    fields:
      liked_count:
        type: string
        source: note_card.interact_info.liked_count
      collected_count:
        type: string
        source: note_card.interact_info.collected_count
      comment_count:
        type: string
        source: note_card.interact_info.comment_count
      share_count:
        type: string
        source: note_card.interact_info.share_count

  content_signal_score:
    type: number
    required: false
    notes: |
      依据 source_strategy.md 素材价值评分：
      collected × 0.35 + share × 0.30 + comment_quality × 0.25 + liked × 0.10
      使用 log1p 压缩，范围 0–100

  material_tier:
    type: string
    enum: ["S", "A", "B", "C", "unrated"]
    required: false
    notes: "S≥75 | A≥50 | B≥25 | C<25"

  topic_candidate:
    type: object
    required: false
    notes: "仅 discovery_role=topic_discovery 时填写，由 Research Agent 填充"
    fields:
      topic:
        type: string
      user_question:
        type: string
      audience_pain_point:
        type: string
      cognitive_conflict:
        type: string
      content_pattern_notes:
        type: string

  source_url:
    type: string
    required: true
    template: "https://www.xiaohongshu.com/explore/{post_id}"

  collected_at:
    type: string
    format: ISO8601
    required: true

  raw_ref:
    type: string
    required: false
    notes: "指向 raw/ 目录下对应原始文件的相对路径，用于溯源"

  # ── image_text Only ─────────────────────────────────────────────

  images:
    type: array
    content_type_filter: image_text
    items:
      type: object
      fields:
        url:
          type: string
          source: "image_list[i].url_default ?? image_list[i].url_pre"
          required: true
        width:
          type: integer
        height:
          type: integer
        file_id:
          type: string
    required: false

  # ── video Only ───────────────────────────────────────────────────
  # video 类型使用目录结构存储，meta.json 不含 transcript 和 frames。
  # 以下字段记录处理状态。

  video_processing:
    type: object
    content_type_filter: video
    required: false
    fields:
      status:
        type: string
        enum: ["pending", "transcribed", "frames_extracted", "complete"]
        notes: "处理状态"
      transcript_path:
        type: string
        notes: "相对路径：transcript.json"
      frames_count:
        type: integer
        notes: "检测到的静态图片帧数量"
      asr_engine:
        type: string
        notes: "使用的 ASR 引擎，如 whisper-base"
      processed_at:
        type: string
        format: ISO8601

# ── transcript.json Schema ───────────────────────────────────────
#
# [
#   {
#     "index": 1,
#     "start": "00:00:03",
#     "end": "00:00:07",
#     "text": "字幕文本"
#   },
#   ...
# ]

# ── frames/{timestamp}/transcript.json Schema ────────────────────
#
# {
#   "frame_time": "00:00:32",
#   "segment_start": "00:00:30",
#   "segment_end": "00:00:45",
#   "segments": [
#     { "index": 12, "start": "00:00:30", "end": "00:00:34", "text": "..." },
#     { "index": 13, "start": "00:00:34", "end": "00:00:45", "text": "..." }
#   ],
#   "full_text": "拼接后的完整文本段落"
# }
